services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: eonpay-api:latest
    container_name: eonpay-api
    init: true
    restart: unless-stopped
    env_file:
      - /etc/eonpay/api.env
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - /etc/eonpay/supabase-prod-ca-2021.crt:/run/secrets/supabase-prod-ca-2021.crt:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/live').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
